name: macOS 12 Build

on:
  workflow_dispatch:
  push:
    branches:
      - macos12

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ ! -d "/Applications/Xcode_26.app" ]; then
            echo "Xcode 26 was not found at /Applications/Xcode_26.app"
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          xcodebuild -version

      - name: Build for macOS 12
        run: |
          xcodebuild \
            -project XDeck.xcodeproj \
            -scheme XDeck \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            build
