name: macOS 12 Build

on:
  workflow_dispatch:
  push:
    branches:
      - macos12

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_APP="$(
            python3 - <<'PY'
          import glob
          import os
          import re

          candidates = []
          for path in glob.glob("/Applications/Xcode_26*.app"):
              match = re.fullmatch(r"Xcode_(26(?:\.\d+)*)\.app", os.path.basename(path))
              if match and os.path.isdir(os.path.join(path, "Contents", "Developer")):
                  version = tuple(int(part) for part in match.group(1).split("."))
                  candidates.append((version, path))

          if candidates:
              print(max(candidates)[1])
          PY
          )"
          if [ -z "$XCODE_APP" ]; then
            echo "No installed Xcode 26.x application was found under /Applications"
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          XCODE_MAJOR="$(printf '%s\n' "$XCODE_VERSION" | awk 'NR == 1 { split($2, version, "."); print version[1] }')"
          if [ "$XCODE_MAJOR" != "26" ]; then
            echo "Expected Xcode major version 26, got: $XCODE_MAJOR"
            exit 1
          fi

      - name: Build for macOS 12
        run: |
          xcodebuild \
            -project XDeck.xcodeproj \
            -scheme XDeck \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app and package test artifact
        run: |
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d -path '*/Build/Products/Debug/XDeck.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Could not find the built Debug/XDeck.app bundle"
            exit 1
          fi

          EXECUTABLE="$APP_PATH/Contents/MacOS/XDeck"
          if [ ! -f "$EXECUTABLE" ]; then
            echo "App executable not found: $EXECUTABLE"
            exit 1
          fi

          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Executable architectures: $ARCHS"
          for REQUIRED_ARCH in x86_64 arm64; do
            case " $ARCHS " in
              *" $REQUIRED_ARCH "*) ;;
              *)
                echo "Required architecture is missing: $REQUIRED_ARCH"
                exit 1
                ;;
            esac
          done

          check_minimum_macos() {
            local VERSION="$1"
            local SOURCE="$2"
            echo "Effective minimum macOS version ($SOURCE): $VERSION"
            if ! python3 -c '
          import sys

          parts = [int(part) for part in sys.argv[1].split(".")]
          parts = (parts + [0, 0, 0])[:3]
          raise SystemExit(tuple(parts) > (12, 0, 0))
          ' "$VERSION"; then
              echo "Minimum macOS version exceeds 12.0 ($SOURCE): $VERSION"
              exit 1
            fi
          }

          BUNDLE_MINIMUM_MACOS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            "$APP_PATH/Contents/Info.plist" 2>/dev/null || true)"
          if [ -n "$BUNDLE_MINIMUM_MACOS" ]; then
            check_minimum_macos "$BUNDLE_MINIMUM_MACOS" "Info.plist"
          fi

          for ARCH in x86_64 arm64; do
            BUILD_INFO="$(xcrun vtool -arch "$ARCH" -show-build "$EXECUTABLE")"
            MINIMUM_MACOS="$(printf '%s\n' "$BUILD_INFO" | awk '$1 == "minos" { print $2; exit }')"
            if [ -z "$MINIMUM_MACOS" ]; then
              echo "Could not read the minimum macOS version for $ARCH from the executable"
              exit 1
            fi
            check_minimum_macos "$MINIMUM_MACOS" "$ARCH executable"
          done

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$RUNNER_TEMP/XDeck-macOS12-debug.zip"

      - name: Upload test artifact
        uses: actions/upload-artifact@v7
        with:
          name: XDeck-macOS12-debug
          path: ${{ runner.temp }}/XDeck-macOS12-debug.zip
          if-no-files-found: error
